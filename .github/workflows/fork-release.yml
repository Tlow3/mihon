name: Fork Release
# Builds the fork with its own app ID and signing key, and publishes the APKs as a GitHub Release
# so they can be downloaded straight to a phone.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository != 'mihonapp/mihon'
    name: Build & publish
    runs-on: 'ubuntu-26.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/fork.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # No -Pdist, so telemetry and the updater (which points at official Mihon) stay off
      - name: Build
        run: ./gradlew assembleRelease -PappIdSuffix=.fork
        env:
          storeFile: ${{ runner.temp }}/fork.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # The attempt number keeps a re-run from clashing with the tag of the attempt before it
          TAG: fork-r${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -e
          mv app/build/outputs/apk/release/app-universal-release.apk "mihon-fork-$TAG.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk "mihon-fork-arm64-v8a-$TAG.apk"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Mihon Fork $TAG" \
            --latest \
            --notes "Built from $GITHUB_SHA. If you're unsure which file to download, use mihon-fork-$TAG.apk." \
            "mihon-fork-$TAG.apk" \
            "mihon-fork-arm64-v8a-$TAG.apk"
